# Сборка Release x64 на GitHub при каждом push и pull request.
# Готовый cce.exe появляется во вкладке Actions -> нужный запуск -> Artifacts.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild cce.sln /m /p:Configuration=Release /p:Platform=x64

      - uses: actions/upload-artifact@v4
        with:
          name: cce-x64
          path: x64/Release/cce.exe
